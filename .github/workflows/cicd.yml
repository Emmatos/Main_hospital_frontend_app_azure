name: Hospital Frontend CI/CD


on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read

env:
  IMAGE_NAME: emmatos1/hospital_frontend_app_azure

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.REGISTRY_NAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login \
            --username "$DOCKERHUB_USERNAME" \
            --password-stdin

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=https://hospitalapi.telcopharmacy.online \
            -t "$IMAGE_NAME:${GITHUB_RUN_NUMBER}" .
          docker push "$IMAGE_NAME:${GITHUB_RUN_NUMBER}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update deployment image
        run: |
          sed -i "s#image: emmatos1/hospital_frontend_app_azure:.*#image: emmatos1/hospital_frontend_app_azure:${GITHUB_RUN_NUMBER}#" deployment/deploy.yaml
          grep "image:" deployment/deploy.yaml

      - name: Log in to Azure
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"

          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Connect to AKS
        run: |
          az aks get-credentials \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AKS_CLUSTER }}" \
            --overwrite-existing

      - name: Apply frontend manifests
        run: |
          kubectl apply -f deployment/configmap.yaml
          kubectl apply -f deployment/service.yaml
          kubectl apply -f deployment/deploy.yaml

      - name: Verify frontend rollout
        run: |
          kubectl rollout status deployment/frontend-hospital-deployment --timeout=180s
          kubectl get pods
          kubectl get services
