apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hospital-ingress
  annotations:
    cert-manager.io/cluster-issuer: production
spec:
  ingressClassName: external-nginx
  tls:
    - hosts:
        - hospital.telcopharmacy.online
      secretName: hospital-frontend-tls-secret
  rules:
    - host: hospital.telcopharmacy.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-hospital-service
                port:
                  number: 3000
